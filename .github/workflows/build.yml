name: Build Lovemachine CS:S Binaries

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x86 Release (DLL & Injector)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild environment
        uses: microsoft/setup-msbuild@v2

      - name: Install Microsoft DirectX SDK (June 2010)
        run: choco install directx-sdk --yes --no-progress --accept-license

      - name: Build Solution (lovemachine.sln)
        run: msbuild lovemachine.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Create Zip Package
        run: |
          powershell Compress-Archive -Path output\* -DestinationPath lovemachine-release-x86.zip -Force

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lovemachine-release-x86
          path: lovemachine-release-x86.zip

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lovemachine CS:S Release (Latest Build)"
          body: |
            ## 🚀 Automated Release Package
            - **lovemachine.dll** (Internal Cheat DLL with DX9 ImGui Menu)
            - **lovemachine_injector.exe** (Smart Console Injector Loader)

            ### 📌 How to Use:
            1. Download and extract `lovemachine-release-x86.zip`.
            2. Open `lovemachine_injector.exe`.
            3. Launch **Counter-Strike: Source** (`hl2.exe`).
            4. Press **ENTER** in the injector console to inject.
            5. In-game, press **INSERT** to open/close the cheat menu!
          files: lovemachine-release-x86.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
